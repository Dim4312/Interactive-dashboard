<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>My Interactive Dashboard</title>
		<link rel="stylesheet" href="css/style.css?v=1">
		<link rel="stylesheet" href="css/magic-eight-ball.css">
		<link rel="icon" href="favicon.svg" type="image/svg+xml">
	</head>
	<body>
		<header>
			<h1>My Interactive Dashboard</h1>
			<p>This is my dashboard for WEB-115.</p>
		</header>
		<!-- The <noscript> is for web browsers with JavaScript rendering disabled. -->
		<noscript>Unfortunately, your web browser does not support JavaScript.</noscript>
		<main>
			<div class="row">
				<div class="col" id="metric-converter">
					<h2>Imperial/Metric Converter</h2>
					<p>Enter a number and choose a conversion below.</p>
					<form id="converter-form" novalidate>
						<div>
							<label for="converter-value">Numeric value</label>
							<input type="number" id="converter-value" name="value" step="any" placeholder="e.g., 10" required>
						</div>
						<div>
							<label for="conversion-type">Conversion type</label>
							<select id="conversion-type" name="conversion">
								<option value="1">Inch to Centimeter</option>
								<option value="2">Foot to Centimeter</option>
								<option value="3">Yard to Meter</option>
								<option value="4">Mile to Kilometer</option>
								<option value="5">Centimeter to Inch</option>
								<option value="6">Centimeter to Foot</option>
								<option value="7">Meter to Yard</option>
								<option value="8">Kilometer to Mile</option>
							</select>
						</div>
						<button type="submit" id="convert-button">Convert</button>
					</form>
					<div id="conversion-result" role="status" aria-live="polite" aria-atomic="true">Result:</div>
					<script src="metric-converter.js" defer></script>
				</div>
				<div class="col" id="magic-eight-ball">
					<script src="js/magic-eight-ball.js" defer></script>
					<h2 class="heading">Magic Eight Ball</h2>
					<form id="eight-ball-form">
						<p>Type a yes/no question, then click the Eight Ball to get an answer.</p>
						<label for="question">Your question</label>
						<input id="question" name="question" type="text">
						<div id="magicEightBall">
							<div id="circle" role="status" aria-live="polite"></div>
							<img id="ball" src="img/magic-eight-ball.png" alt="Ask the Magic Eight Ball" role="button" tabindex="0">
						</div>
						<button id="reset" name="reset" type="reset">Ask another question</button>
						<button id="add-response" type="button">Add a response</button>
					</form>
				</div>
			</div>
		</main>
		<footer>Created by Dmytro Vizir for WEB-115.</footer>
	</body>
</html>
